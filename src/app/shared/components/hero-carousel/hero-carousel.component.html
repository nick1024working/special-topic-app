<section id="billboard" class="container py-5">
    <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="5000">
        <div class="carousel-inner">

            <!-- Slide 1 -->
            <div class="carousel-item active">
                <div class="container">
                    <div class="row align-items-center min-vh-50">
                        <!-- 左文字 -->
                        <div class="col-md-6 text-center text-md-start">
                            <h1 class="display-4 fw-bolder">Summer!<br>夏日閱讀好時節</h1>
                            <p class="lead text-muted lh-base">
                                <span class="fw-bolder text-primary">8/11 ~ 8/24 全站 8 折起</span><br>
                                夏日炎炎，陪你一同沉浸閱讀好時光
                            </p>
                            <a href="#" class="btn btn-outline-dark px-4 py-2 mt-3">
                                立即看看<i class="bi bi-arrow-right ms-2"></i>
                            </a>
                        </div>

                        <!-- 右圖片 -->
                        <div class="col-md-6 text-center position-relative">
                            <img src="assets/images/home-page/main-banner1.jpg" alt="Book Cover"
                                class="img-fluid position-relative rounded" style="max-height: 350px; z-index: 2;">

                            <img src="assets/images/deco-pattern1.png" alt="Decorative Pattern"
                                class="position-absolute start-50 translate-middle-x"
                                style="max-height: 450px; bottom: -50px; z-index: 1;">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Slide 2 -->
            <div class="carousel-item">
                <div class="container">
                    <div class="row align-items-center min-vh-50">
                        <!-- 左文字 -->
                        <div class="col-md-6 text-center text-md-start">
                            <h1 class="display-4 fw-bolder">舊書市集<br></h1>
                            <p class="lead text-muted lh-base">
                                <span class="fw-bolder text-primary">8/15 ~ 8/17 大安森林公園</span><br>
                                各式書籍、雜誌，呈現獨具風格的人文視角。
                            </p>
                            <a href="#" class="btn btn-outline-dark px-4 py-2 mt-3">
                                更多詳情<i class="bi bi-arrow-right ms-2"></i>
                            </a>
                        </div>

                        <!-- 右圖片 -->
                        <div class="col-md-6 text-center position-relative">
                            <img src="assets/images/home-page/main-banner2.jpg" alt="Book Cover"
                                class="img-fluid position-relative rounded" style="max-height: 350px; z-index: 2;">

                            <img src="assets/images/deco-pattern2.png" alt="Decorative Pattern"
                                class="position-absolute start-50 translate-middle-x"
                                style="max-height: 450px; bottom: -50px; z-index: 1;">
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- 控制箭頭 -->
        <!-- 左箭頭 -->
        <button class="carousel-control-prev custom-carousel-arrow" type="button" data-bs-target="#heroCarousel"
            data-bs-slide="prev">
            <i class="bi bi-arrow-left arrow-thin text-dark"></i>
        </button>

        <!-- 右箭頭 -->
        <button class="carousel-control-next custom-carousel-arrow" type="button" data-bs-target="#heroCarousel"
            data-bs-slide="next">
            <i class="bi bi-arrow-right arrow-thin text-dark"></i>
        </button>
    </div>
</section>
