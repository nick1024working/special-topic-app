<div class="container js-container" style="margin-bottom: 20vh;">
    <!-- Checkout Stepper -->
    <ol class="stepper list-unstyled d-flex justify-content-center my-5">
        <li class="step d-flex flex-column align-items-center text-center done">
            <span class="dot">1</span>
            <span class="mt-2">購物車</span>
        </li>
        <li class="step d-flex flex-column align-items-center text-center done">
            <span class="dot">2</span>
            <span class="mt-2">填寫資料</span>
        </li>
        <li class="step d-flex flex-column align-items-center text-center">
            <span class="dot">3</span>
            <span class="mt-2">訂單確認</span>
        </li>
    </ol>

    <div class="cart-content">
        <div class="row g-4">
            <!-- 左：送貨資料 -->
            <div class="col-md-6">
                <section class="card shadow-sm mb-4">
                    <div class="card-header d-flex align-items-center justify-content-between">
                        <h4 class="p-1 mb-0">送貨資料</h4>
                        <span class="badge bg-light text-dark">運費：NT$350</span>
                    </div>
                    <div class="card-body">
                        <form novalidate>
                            <div class="form-check mb-3">
                                <input id="sameAsCustomer" class="form-check-input" type="checkbox">
                                <label class="form-check-label" for="sameAsCustomer">收件人資料與顧客資料相同</label>
                            </div>

                            <div class="mb-3">
                                <label for="receiverName" class="form-label">收件人名稱</label>
                                <input id="receiverName" type="text" class="form-control" placeholder="請輸入收件人姓名">
                                <div class="form-text">請填入收件人真實姓名，以確保順利收件</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">收件人電話號碼</label>
                                <div class="input-group">
                                    <select class="form-select" style="max-width: 120px;">
                                        <option selected>TW +886</option>
                                        <option>JP +81</option>
                                        <option>HK +852</option>
                                        <option>US +1</option>
                                    </select>
                                    <input type="tel" class="form-control" placeholder="0912 345 678">
                                </div>
                            </div>

                            <hr class="my-4">

                            <div class="mb-3">
                                <label class="form-label">送貨地點</label>
                                <input type="text" class="form-control" value="台灣" disabled>
                            </div>

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="city" class="form-label">城市 / 縣</label>
                                    <select id="city" class="form-select">
                                        <option selected>請選擇</option>
                                        <option>台北市</option>
                                        <option>新北市</option>
                                        <option>桃園市</option>
                                        <option>台中市</option>
                                        <option>台南市</option>
                                        <option>高雄市</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="district" class="form-label">地區</label>
                                    <select id="district" class="form-select">
                                        <option selected>請先選擇城市 / 縣</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mt-3">
                                <label for="address" class="form-label">地址</label>
                                <input id="address" type="text" class="form-control" placeholder="道路、巷弄、門牌、樓層等">
                            </div>
                        </form>
                    </div>
                </section>
            </div>

            <!-- 右：顧客 + 付款 -->
            <div class="col-md-6">
                <!-- 顧客資料 -->
                <section class="card shadow-sm mb-4">
                    <div class="card-header d-flex align-items-center justify-content-between">
                        <h4 class="p-1 mb-0">顧客資料</h4>
                        <small class="text-muted">已經是會員？登入後可以更方便管理訂單！</small>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <button type="button" class="btn btn-success w-100">會員登入</button>
                        </div>

                        <form novalidate>
                            <div class="mb-3">
                                <label for="custName" class="form-label">顧客名稱</label>
                                <input id="custName" type="text" class="form-control" placeholder="請輸入姓名">
                            </div>

                            <div class="mb-3">
                                <label for="custEmail" class="form-label">電子信箱</label>
                                <input id="custEmail" type="email" class="form-control" placeholder="name@example.com">
                                <div class="form-text">訂單通知將寄送至此 Email</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">電話號碼</label>
                                <div class="input-group">
                                    <select class="form-select" style="max-width: 120px;">
                                        <option selected>TW +886</option>
                                    </select>
                                    <input type="tel" class="form-control" placeholder="0912 345 678">
                                </div>
                            </div>

                            <div class="mb-0">
                                <label class="form-label">生日日期</label>
                                <div class="row g-2">
                                    <div class="col-4">
                                        <select class="form-select">
                                            <option>年</option>
                                        </select>
                                    </div>
                                    <div class="col-4">
                                        <select class="form-select">
                                            <option>月</option>
                                        </select>
                                    </div>
                                    <div class="col-4">
                                        <select class="form-select">
                                            <option>日</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </section>

                <!-- 付款方式 -->
                <section class="card shadow-sm">
                    <div class="card-header">
                        <h4 class="p-1 mb-0">付款方式</h4>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="payment" class="form-label">選擇付款方式</label>
                            <select id="payment" class="form-select">
                                <option selected>LINE Pay</option>
                                <option>信用卡</option>
                                <option>銀行轉帳 / ATM</option>
                                <option>貨到付款（限面交）</option>
                            </select>
                            <div class="form-text mt-2">若選擇轉帳，提交訂單後將顯示匯款資訊。</div>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <!-- 底部操作區 -->
    <div class="checkout-actions border-top pt-3 mt-5">
        <div class="d-flex justify-content-between">
            <a class="btn btn-outline-secondary" routerLink="/cart">
                返回購物車
            </a>
            <button type="button" class="btn btn-success" routerLink="/checkout/review">
                提交訂單
            </button>
        </div>
    </div>
</div>
