<div class="container js-container" style="margin-bottom: 20vh;">
    <!-- Checkout Stepper -->
    <ol class="stepper list-unstyled d-flex justify-content-center my-5">
        <li class="step d-flex flex-column align-items-center text-center done">
            <span class="dot">1</span>
            <span class="mt-2">購物車</span>
        </li>
        <li class="step d-flex flex-column align-items-center text-center done">
            <span class="dot">2</span>
            <span class="mt-2">填寫資料</span>
        </li>
        <li class="step d-flex flex-column align-items-center text-center">
            <span class="dot">3</span>
            <span class="mt-2">訂單確認</span>
        </li>
    </ol>

    @if (isAllDataValid){
    <div class="cart-content">
        <div class="row g-4">
            <!-- 左：送貨 + 付款資料 -->
            <div class="col-md-6">
                <!-- 送貨資料 -->
                <section class="card shadow-sm mb-4">
                    <div class="card-header d-flex align-items-center justify-content-between">
                        <h4 class="p-1 mb-0">送貨資料</h4>
                        <span class="badge bg-light text-dark">送貨方式：{{ deliveryToRepr(deliveryOpt) }} / 運費：NT${{cart.deliveryFee}}</span>
                    </div>
                    <!-- <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">送貨方式</label>
                            <input type="text" class="form-control" [value]="deliveryToRepr(deliveryOpt)" disabled>
                            <div class="form-text mt-2">{{ deliveryToDesc(deliveryOpt) }}</div>
                        </div>
                    </div> -->
                    <div class="card-body">
                        <form novalidate>
                            <div class="form-check mb-3">
                                <input id="sameAsCustomer" class="form-check-input" type="checkbox">
                                <label class="form-check-label" for="sameAsCustomer">收件人資料與顧客資料相同</label>
                            </div>

                            <div class="mb-3">
                                <label for="receiverName" class="form-label">收件人名稱</label>
                                <input id="receiverName" type="text" class="form-control" placeholder="請輸入收件人姓名">
                                <div class="form-text">請填入收件人真實姓名，以確保順利收件</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">收件人電話號碼</label>
                                <input type="tel" class="form-control" placeholder="0921000000">
                            </div>

                            <hr class="my-4">

                            <div class="mb-3">
                                <label class="form-label">送貨地點</label>
                                <input type="text" class="form-control" value="台灣" disabled>
                            </div>

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="county" class="form-label">縣市</label>
                                    <select #countySel id="county" class="form-select"
                                        (change)="onCountySelect(countySel.value)">
                                        <option selected disabled>請先選擇城市 / 縣</option>
                                        @for(county of countyList(); track county.id){
                                        <option [value]="county.id">{{ county.name }}</option>
                                        }
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="district" class="form-label">鄉鎮市區</label>
                                    <select id="district" class="form-select">
                                        <option selected>請先選擇城市 / 縣</option>
                                        @for(district of districtList(); track district.id){
                                        <option [value]="district.id">{{ district.name }}</option>
                                        }
                                    </select>
                                </div>
                            </div>

                            <div class="mt-3">
                                <label for="address" class="form-label">地址</label>
                                <input id="address" type="text" class="form-control" placeholder="道路、巷弄、門牌、樓層等">
                            </div>
                        </form>
                    </div>
                </section>
                <!-- 付款資料 -->
                <!-- <section class="card shadow-sm">
                    <div class="card-header">
                        <h4 class="p-1 mb-0">付款資料</h4>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">付款方式</label>
                            <input type="text" class="form-control" [value]="paymentToRepr(paymentOpt)" disabled>
                            <div class="form-text mt-2">{{ paymentToDesc(paymentOpt) }}</div>
                        </div>
                    </div>
                </section> -->
            </div>

            <!-- 右：顧客 -->
            <div class="col-md-6">
                <!-- 顧客資料 -->
                <section class="card shadow-sm mb-4">
                    <div class="card-header d-flex align-items-center justify-content-between">
                        <h4 class="p-1 mb-0">顧客資料</h4>
                        <small class="text-muted">已經是會員？登入後可以更方便管理訂單！</small>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <button type="button" class="btn btn-success w-100" routerLink="/login">會員登入</button>
                        </div>

                        <form novalidate>
                            <div class="mb-3">
                                <label for="custName" class="form-label">顧客名稱</label>
                                <input id="custName" type="text" class="form-control" placeholder="請輸入姓名">
                            </div>

                            <div class="mb-3">
                                <label for="custEmail" class="form-label">電子信箱</label>
                                <input id="custEmail" type="email" class="form-control" placeholder="name@example.com">
                                <div class="form-text">訂單通知將寄送至此 Email</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">電話號碼</label>
                                <input type="tel" class="form-control" placeholder="0921000000">
                            </div>
                        </form>
                    </div>
                </section>
            </div>
        </div>
    </div>
    } @else {
    <h4 class="p-1 mb-0">購物車無商品</h4>
    }

    <!-- 底部操作區 -->
    <div class="checkout-actions border-top pt-3 mt-5">
        <div class="d-flex justify-content-between">
            <button type="button" class="btn btn-outline-secondary" routerLink="/cart" (click)="scrollToTop();">
                返回購物車
            </button>
            <button type="button" class="btn btn-success" routerLink="/checkout-review" (click)="scrollToTop();">
                確認訂單
            </button>
        </div>
    </div>
</div>
