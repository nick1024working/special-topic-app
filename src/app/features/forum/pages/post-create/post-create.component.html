<div class="container my-4">
  <div class="row">
    <!-- 主欄 -->
    <div class="col-lg-8 col-md-8">
      <div class="post">
        <div class="topwrap p-3 border rounded">
          <!-- 上方作者區：改用 d-flex 取代 pull-left -->
          <div class="d-flex align-items-start mb-3">
            <div class="userinfo d-none d-sm-block me-3 text-center">
              <div class="avatar position-relative mb-2">
                <img src="assets/forum-v4/images/avatar4.jpg" alt="avatar" width="64" height="64" class="rounded-circle" />
                <span class="status bg-success position-absolute rounded-circle"
                      style="width:10px;height:10px;bottom:2px;right:2px;"></span>
              </div>
              <div class="icons d-none d-md-block">
                <img src="assets/forum-v4/images/icon3.jpg" alt="" class="me-1" />
                <img src="assets/forum-v4/images/icon4.jpg" alt="" class="me-1" />
                <img src="assets/forum-v4/images/icon5.jpg" alt="" class="me-1" />
                <img src="assets/forum-v4/images/icon6.jpg" alt="" />
              </div>
            </div>

            <div class="posttext flex-grow-1">
              <h2 class="h4 fw-bold mb-3">建立新主題</h2>

              <form [formGroup]="form" (ngSubmit)="submit()">
                <!-- 標題 -->
                <div class="mb-3">
                  <label class="form-label">標題</label>
                  <input
                    type="text"
                    class="form-control"
                    formControlName="title"
                    placeholder="請輸入文章標題 (最多 100 字)" />
                  <div class="text-danger small mt-1" *ngIf="f['title'].touched && f['title'].invalid">
                    標題為必填（最多 100 字）
                  </div>
                </div>

                <!-- 分類 / 篩選 -->
                <div class="row g-3">
                  <div class="col-sm-6">
                    <label class="form-label">分類</label>
                    <select class="form-select" formControlName="postCategoryID">
                      <option [ngValue]="null">請選擇分類</option>
                      <option [value]="1">公告通知</option>
                      <option [value]="2">站務管理</option>
                      <!-- TODO: 改成 API 載入 -->
                    </select>
                  </div>
                  <div class="col-sm-6">
                    <label class="form-label">篩選</label>
                    <select class="form-select" formControlName="postFilterID">
                      <option [ngValue]="null">請選擇篩選</option>
                      <option [value]="1">一般</option>
                      <option [value]="2">精華</option>
                      <!-- TODO: 改成 API 載入 -->
                    </select>
                  </div>
                </div>

                <!-- 內容 -->
                <div class="mt-3">
                  <label class="form-label">內容</label>
                  <textarea
                    rows="8"
                    class="form-control"
                    formControlName="contentHtml"
                    placeholder="輸入文章內容…"></textarea>
                </div>

                <!-- 圖片上傳 -->
                <div class="mt-3">
                  <label class="form-label">圖片上傳（可多張）</label>
                  <input
                    type="file"
                    class="form-control"
                    (change)="onFilesSelected($event)"
                    multiple
                    accept="image/*" />

                  <!-- 預覽區 -->
                  <div class="row g-2 mt-2" *ngIf="previews?.length">
                    <div class="col-6 col-sm-4 col-md-3" *ngFor="let p of previews; let i = index">
                      <div class="thumb border rounded p-1 h-100">
                        <img
                          [src]="p.url"
                          class="img-fluid mb-1 w-100"
                          style="aspect-ratio: 1/1; object-fit: cover;" />
                        <div class="form-check">
                          <input
                            class="form-check-input"
                            type="radio"
                            name="main"
                            [value]="i"
                            formControlName="mainIndex" />
                          <label class="form-check-label small">主圖</label>
                        </div>
                        <button
                          type="button"
                          class="btn btn-sm btn-outline-secondary w-100 mt-1"
                          (click)="removeImage(i)">
                          移除
                        </button>
                      </div>
                    </div>
                  </div>

                  <div class="text-muted small mt-1">
                    （預設<b>不設定主圖</b>，若要設定請勾選；上傳後也可在圖片管理再設定）
                  </div>
                </div>

                <!-- 底部操作列 -->
                <div class="postinfobot mt-4 d-flex align-items-center justify-content-between">
                  <div class="left">
                    <a routerLink="/forum/list" class="btn btn-light">
                      <i class="fa fa-reply"></i> 返回列表
                    </a>
                  </div>
                  <div class="right">
                    <button type="submit" class="btn btn-primary" [disabled]="form.invalid">發布文章</button>
                  </div>
                </div>
              </form>
            </div>
          </div><!-- /topwrap -->
        </div><!-- /post -->
      </div>
    </div>

    <!-- 側欄 -->
    <div class="col-lg-4 col-md-4">
      <div class="sidebarblock">
        <h3>發文小提醒</h3>
        <div class="divline"></div>
        <div class="blocktxt small text-muted">
          • 標題清楚、分類正確<br />
          • 內容可貼圖片，發佈後仍可編輯<br />
          • 違規內容將被移除
        </div>
      </div>
    </div>
  </div>
</div>
