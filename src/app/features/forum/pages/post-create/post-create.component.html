<div class="content">
  <div class="container">
    <div class="row">
      <div class="col-lg-8 col-md-10 mx-auto">
        <div class="breadcrumbf mb-3">
          <a routerLink="/">首頁</a> »
          <a routerLink="/forum/list">論壇</a> »
          <span>{{ isEdit ? '編輯文章' : '發表文章' }}</span>
        </div>

        <h2 class="fw-bold mb-3">{{ isEdit ? '編輯文章' : '發表新主題' }}</h2>

        <form [formGroup]="form" (ngSubmit)="submit()">
          <div class="mb-3">
            <label class="form-label">標題</label>
            <input type="text" class="form-control" formControlName="title">
          </div>

          <div class="mb-3">
            <label class="form-label">分類</label>
            <select class="form-select" formControlName="postCategoryID">
              <option [ngValue]="null">— 請選擇分類 —</option>
              <option *ngFor="let c of categories" [ngValue]="c.id">{{ c.name }}</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">內容</label>
            <textarea class="form-control" rows="10" formControlName="contentHtml"></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">圖片（可多張）</label>
            <input type="file" class="form-control" (change)="onFileChange($event)" multiple>
            <div *ngIf="files.length" class="small text-muted mt-1">
              已選擇 {{ files.length }} 張圖片
              <ul class="mb-0">
                <li *ngFor="let f of files; let i = index">
                  {{ f.name }}
                  <button type="button" class="btn btn-sm btn-link" (click)="removeFile(i)">移除</button>
                </li>
              </ul>
            </div>
          </div>
<!-- 已存在的舊圖（編輯模式） -->
<div class="mb-3" *ngIf="isEdit && existingImages.length">
  <label class="form-label">已上傳的圖片</label>
  <div class="row g-2">
    <div class="col-6 col-md-4 col-lg-3" *ngFor="let img of existingImages">
      <div class="card">
        <img [src]="img.src" class="card-img-top" alt="existing image">
        <div class="card-body text-center">
          <button type="button" class="btn btn-sm btn-danger"
                  (click)="removeExistingImage(img.imageId)">
            刪除
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

          <div class="mt-3">
            <button class="btn btn-primary" type="submit" [disabled]="submitting">
              {{ isEdit ? '儲存變更' : '送出發表' }}
            </button>
            <a class="btn btn-light ms-2" [routerLink]="isEdit && postId ? ['/forum', postId] : ['/forum/list']">取消</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
