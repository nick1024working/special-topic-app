<div class.bind_entity_id="container" *ngIf="book">
    <div nz-row [nzGutter]="[32, 24]">

        <div nz-col [nzXs]="24" [nzMd]="8" class="book-cover">
            <nz-carousel *ngIf="book.imagePaths && book.imagePaths.length > 1" nzAutoPlay>
                <div nz-carousel-content *ngFor="let imagePath of book.imagePaths">
                    <img [src]="imagePath" [alt]="book.ebookName" class="carousel-image">
                </div>
            </nz-carousel>

            <img *ngIf="!book.imagePaths || book.imagePaths.length <= 1" [src]="book.primaryCoverPath"
                [alt]="book.ebookName" class="single-cover-image">
        </div>

        <div nz-col [nzXs]="24" [nzMd]="16" class="book-info">
            <h1>{{ book.ebookName }}</h1>
            <p class="author">作者：{{ book.author }}</p>
            <p class="publisher">出版社：{{ book.publisher }}</p>
            <div class="price">
                <div>
                    <span class="label">定價：</span>
                    <span class="amount" [class.strikethrough]="showStrikethrough">
                        {{ book.fixedPrice }} 元
                    </span>
                </div>

                <div *ngIf="showStrikethrough">
                    <span class="label sale-price-label">售價：</span>
                    <span class="amount sale-price-amount">
                        {{ displayActualPrice }} 元
                    </span>
                </div>
            </div>
            <div class="actions">
                <button nz-button nzType="primary" class="buy-button">加入購物車</button>
            </div>
            <div class="description">
                <h3>內容簡介</h3>
                <p>{{ book.bookDescription }}</p>
            </div>
        </div>
    </div>
</div>
