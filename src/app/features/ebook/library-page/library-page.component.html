<div style="padding: 24px; max-width: 1200px; margin: auto;">
    <h1 style="margin-bottom: 24px;">我的書櫃</h1>

    <div nz-row [nzGutter]="[16, 24]">
        <div nz-col [nzXs]="12" [nzSm]="8" [nzMd]="6" [nzLg]="4" *ngFor="let book of purchasedBooks">

            <a [routerLink]="['/ebook', book.ebookId]">
                <nz-card nzHoverable [nzCover]="coverTemplate" style="height: 100%;">
                    <nz-card-meta [nzTitle]="book.ebookName"
                        style="text-align: center; margin-top: 8px;"></nz-card-meta>
                    <div style="margin-top: 8px;">
                        <nz-progress [nzPercent]="book.progress" nzSize="small" [nzShowInfo]="false"></nz-progress>
                    </div>
                </nz-card>
            </a>

            <ng-template #coverTemplate>
                <img [src]="book.primaryCoverPath" alt="Book cover"
                    style="height: 250px; object-fit: contain; padding: 8px;" />
            </ng-template>

        </div>
    </div>
</div>
