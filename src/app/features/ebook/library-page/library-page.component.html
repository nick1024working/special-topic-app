<div class="library-container">
    <h2>我的書櫃</h2>
    <div class="book-grid">
        <div class="book-card" *ngFor="let book of purchasedBooks">
            <img [src]="book.primaryCoverPath" [alt]="book.ebookName" class="book-cover"
                (click)="openBook(book.ebookId)">
            <div class="book-info">
                <h3>{{ book.ebookName }}</h3>
                <p>{{ book.author }}</p>
                <nz-progress [nzPercent]="book.progress" [nzShowInfo]="true" nzSize="small"></nz-progress>
                <button class="read-button" (click)="openBook(book.ebookId)">開書</button>
            </div>
        </div>
    </div>
</div>
