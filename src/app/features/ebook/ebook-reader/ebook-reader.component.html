<div class="reader-container">
    <pdf-viewer [src]="pdfSrc" [render-text]="true" [show-all]="false" [(page)]="currentPage"
        (after-load-complete)="afterLoadComplete($event)"
        style="display: block; width: 100%; height: 100%;"></pdf-viewer>

    <button class="nav-button prev-button" (click)="prevPage()" [disabled]="currentPage === 1">
        <span>‹</span>
    </button>

    <button class="nav-button next-button" (click)="nextPage()" [disabled]="currentPage === totalPages">
        <span>›</span>
    </button>

    <div class="navigation-bar">
        <button (click)="prevPage()" [disabled]="currentPage === 1">上一頁</button>

        <div class="page-indicator">
            <span>第</span>
            <input type="number" class="page-input" #pageInput [value]="currentPage"
                (keyup.enter)="jumpToPage(pageInput.value)" (blur)="jumpToPage(pageInput.value)" />
            <span>/ {{ totalPages }} 頁</span>
        </div>

        <button (click)="nextPage()" [disabled]="currentPage === totalPages">下一頁</button>
    </div>
</div>
