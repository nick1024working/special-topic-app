<div class="ranking-container">
  <h1>排行榜</h1>

  <div nz-row [nzGutter]="[24, 24]">

    <div nz-col [nzXs]="24" [nzMd]="12">
      <h3 class="ranking-title">暢銷排行榜</h3>
      <nz-list nzItemLayout="horizontal">
        <nz-list-item *ngFor="let item of bestsellingBooks; let i = index" [nzExtra]="extra">
          <nz-list-item-meta>
            <nz-list-item-meta-avatar>
              <span class="ranking-number">{{ i + 1 }}</span>
            </nz-list-item-meta-avatar>
            <nz-list-item-meta-title>
              <a [routerLink]="['/ebook', item.id]">{{ item.title }}</a>
            </nz-list-item-meta-title>
            <nz-list-item-meta-description>
              作者：{{ item.author }}
            </nz-list-item-meta-description>
          </nz-list-item-meta>
          <ng-template #extra>
            <img [src]="item.coverImage" alt="{{ item.title }}" class="ranking-cover-image">
          </ng-template>
        </nz-list-item>
      </nz-list>
    </div>

    <div nz-col [nzXs]="24" [nzMd]="12">
      <h3 class="ranking-title">熱門排行榜</h3>
      <nz-list nzItemLayout="horizontal">
        <nz-list-item *ngFor="let item of hotBooks; let i = index" [nzExtra]="extra">
          <nz-list-item-meta>
            <nz-list-item-meta-avatar>
              <span class="ranking-number">{{ i + 1 }}</span>
            </nz-list-item-meta-avatar>
            <nz-list-item-meta-title>
              <a [routerLink]="['/ebook', item.id]">{{ item.title }}</a>
            </nz-list-item-meta-title>
            <nz-list-item-meta-description>
              作者：{{ item.author }}
            </nz-list-item-meta-description>
          </nz-list-item-meta>
          <ng-template #extra>
            <img [src]="item.coverImage" alt="{{ item.title }}" class="ranking-cover-image">
          </ng-template>
        </nz-list-item>
      </nz-list>
    </div>

  </div>
</div>
