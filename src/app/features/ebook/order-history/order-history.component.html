<div class="container">
    <h1>我的訂單</h1>
    <nz-spin [nzSpinning]="isLoading">
        <nz-table #orderTable [nzData]="orders" [nzShowPagination]="false" *ngIf="!isLoading && orders.length > 0">
            <thead>
                <tr>
                    <th class="expand-column"></th>
                    <th>訂單資訊</th>
                    <th>狀態</th>
                    <th nzAlign="right">訂單總金額</th>
                </tr>
            </thead>
            <tbody>
                <ng-container *ngFor="let order of orderTable.data">
                    <tr>
                        <td [nzExpand]="order.expand" (nzExpandChange)="order.expand = !order.expand"></td>
                        <td>
                            <div class="order-info-cell">
                                <span class="order-date">訂單日期：{{ order.orderDate }}</span>
                                <span class="order-id">訂單編號：{{ order.orderId }}</span>
                            </div>
                        </td>
                        <td>
                            <span class="order-status" [ngClass]="'status-' + order.status">{{ order.status }}</span>
                        </td>
                        <td nzAlign="right">
                            <span class="total-amount">NT$ {{ order.totalAmount }}</span>
                        </td>
                    </tr>
                    <tr [nzExpand]="order.expand">
                        <td></td>
                        <td colspan="3" class="inner-table-cell">
                            <nz-table #itemTable [nzData]="order.items" [nzShowPagination]="false"
                                nzFrontPagination="false" class="inner-table">
                                <thead>
                                    <tr>
                                        <th>商品名稱</th>
                                        <th nzAlign="right">單價</th>
                                        <th nzAlign="center">數量</th>
                                        <th nzAlign="right">小計</th>
                                    </tr>
                                </thead>
            <tbody>
                <tr *ngFor="let item of itemTable.data">
                    <td>
                        <div class="item-info">
                            <img [src]="item.primaryCoverPath || 'assets/images/default-cover.png'"
                                [alt]="item.ebookName">
                            <a [routerLink]="['/ebook', item.ebookId]">{{ item.ebookName }}</a>
                        </div>
                    </td>
                    <td nzAlign="right">NT$ {{ item.price }}</td>
                    <td nzAlign="center">{{ item.quantity }}</td>
                    <td nzAlign="right">NT$ {{ item.price * item.quantity }}</td>
                </tr>
            </tbody>
        </nz-table>
        </td>
        </tr>
        </ng-container>
        </tbody>
        </nz-table>

        <div *ngIf="!isLoading && orders.length === 0" class="no-orders">
            <p>您目前沒有任何訂單記錄。</p>
        </div>
    </nz-spin>
</div>
