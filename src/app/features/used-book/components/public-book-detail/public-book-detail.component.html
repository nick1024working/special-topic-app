<div class="container-fluid bg-white p-5 mt-4">
  <div class="container mb-2">
    <div class="row mb-4">
      <!-- 左側：圖片區（純 CSS 切換，不用 JS/TS） -->
      <div class="col-sm-3">
        <!-- 隱藏的切換器 -->
        <input type="radio" name="gallery" id="g1" checked hidden>
        <input type="radio" name="gallery" id="g2" hidden>
        <input type="radio" name="gallery" id="g3" hidden>

        <!-- 主圖區 -->
        <div class="mb-3 shadow-sm rounded overflow-hidden bg-white">
          <div class="gallery-stage">
            <div class="slide s1">
              <img src="https://placehold.co/400x600" alt="封面 1">
            </div>
          </div>
        </div>

        <!-- 縮圖區 -->
        <div class="d-grid grid-thumbs">
        </div>
      </div>

      <!-- 中間：書籍資訊 -->
      <div class="col-sm-6">
        <h4 class="fw-bold mb-4">書名（示意）</h4>
        <hr />

        <div class="mb-3">
          <span class="fw-semibold">作者：</span><span>作者名稱（示意）</span>
        </div>

        <div class="mb-3">
          <span class="fw-semibold">出版社：</span><span class="me-4">某某出版社</span>
          <span class="fw-semibold">出版日期：</span><span>2024/01/01</span>
        </div>

        <div class="mb-3">
          <span class="fw-semibold">ISBN：</span><span>978-0000000000</span>
        </div>

        <div class="mb-3">
          <span class="fw-semibold">頁數：</span><span class="me-4">320</span>
          <span class="fw-semibold">版次：</span><span>初版</span>
        </div>

        <div class="mb-3">
          <span class="fw-semibold">語言：</span><span class="me-4">繁中</span>
          <span class="fw-semibold">裝訂：</span><span>平裝</span>
        </div>

        <div class="mb-3">
          <span class="fw-semibold">內容分級：</span><span>普遍級</span>
        </div>

        <hr />

        <div class="mb-3 d-flex align-items-center">
          <span class="fw-semibold me-2">書況評等：</span>
          <span class="badge bg-info text-dark">近全新</span>
        </div>

        <div class="mb-3">
          <span class="fw-semibold">書況說明：</span>
          <div class="text-body">
            書況描述範例：書邊微黃，內頁整潔無畫記，封面略有摩痕。
          </div>
        </div>

        <hr />

        <div class="fs-5 fw-normal text-muted text-decoration-line-through">
          原價：NT$1,250
        </div>

        <div class="mt-4">
          <span class="fs-5 fw-normal">二手價：</span>
          <span class="fs-2 fw-bold text-danger">NT$999</span>
        </div>
      </div>

      <!-- 右側：賣家資訊 -->
      <div class="col-sm-3 border border-secondary px-4 py-3">
        <div class="mb-3">
          <p class="fw-semibold mb-1">賣家ID：</p>
          <span class="font-monospace">00000000-0000-0000-0000-000000000000</span>
        </div>

        <div class="mb-3">
          <p class="fw-semibold mb-1">面交地點：</p>
          <i class="bi bi-geo-alt-fill text-secondary me-1"></i>
          <span>台北市 中正區</span>
        </div>

        <div class="mb-3">
          <p class="fw-semibold mb-1">建立時間：</p>
          <span class="me-2">2025/08/01</span><span>AM 10:20:30</span>
        </div>

        <div class="mb-0">
          <p class="fw-semibold mb-1">更新時間：</p>
          <span class="me-2">2025/08/08</span><span>PM 03:12:45</span>
        </div>
      </div>
    </div>
  </div>
</div>

<hr />
