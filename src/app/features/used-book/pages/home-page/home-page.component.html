<section class="container mb-5">
    <div class="row justify-content-center">

            <!-- 公告 Bar -->
            <div class="bg-light border my-2 py-2">
                <div class="container d-flex align-items-center justify-content-center">
                    <i class="bi bi-megaphone me-2"></i>
                    <span>
                        參加 2025 暑假讀書季，達成指定任務，即可抽全站優惠劵，最低享購書 <strong>NT$1</strong>元！
                        <a href="#" class="ms-2 text-primary fw-bold text-decoration-none">立刻參加 →</a>
                    </span>
                </div>
            </div>

            <!-- 輪播 -->
            <div id="carouselExampleIndicators" class="carousel slide mb-2" data-bs-ride="carousel">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0"
                        class="active" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"
                        aria-label="Slide 2"></button>
                </div>
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="assets/images/used-book/UsedBook_BN-2.jpg" class="d-block w-100">
                    </div>
                    <div class="carousel-item">
                        <img src="assets/images/used-book/UsedBook_BN-1.jpg" class="d-block w-100">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>

            <!-- 分類按鈕列 -->
            <div class="py-3 border-top border-bottom mb-3">
                <div class="container d-flex flex-wrap gap-3 justify-content-center">
                    @for (category of categoryList(); track category.id) {
                        <a [routerLink]="['/used-book', 'books']" [queryParams]="{ categoryId: category.id }" (click)="scrollTop()"
                        class="btn btn-outline-primary rounded-3 px-4 d-flex align-items-center">
                        <i class="bi bi-briefcase me-2"></i> {{ category.name }}
                    </a>
                    }
                    <a [routerLink]="['/used-book', 'books']" (click)="scrollTop()"
                        class="btn btn-outline-primary rounded-3 px-4 d-flex align-items-center">
                        <i class="bi bi-three-dots me-2"></i> 更多
                    </a>
                </div>
            </div>
            @for(tag of tagWithCardList(); track tag.id){
            <app-ub-book-row [title]="tag.name" [bookCardList]="tag.bookCardList"
                [moreLink]="tag.moreLink"></app-ub-book-row>
            <hr class="">
            }
    </div>
</section>
