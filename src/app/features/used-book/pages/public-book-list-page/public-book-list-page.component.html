<section class="mb-5">
    <div class="container-fluid" style="width: 90vw;">
        <!-- Breadcrumb -->
        <nav>
            <ol class="breadcrumb my-2">
                <li class="breadcrumb-item"><a class="text-decoration-underline" routerLink="/used-book">首頁</a></li>
                @if (!categoryId()) {
                <li class="breadcrumb-item text-primary">全部分類</li>
                } @else {
                <li class="breadcrumb-item"><a class="text-decoration-underline" routerLink="/used-book/books">全部分類</a>
                </li>
                <li class="breadcrumb-item text-primary">{{ getCategoryName() }}</li>
                }
            </ol>
        </nav>

        <!-- 版型：左側 sidebar（lg 起為 2 欄 = 1/6），右側內容（10 欄 = 5/6） -->
        <div class="row g-3">

            <!-- Sidebar：小螢幕可收合，大螢幕固定顯示 -->
            <div class="col-12 col-lg-2">
                <app-ub-book-filter (query)="onFilterChanged($event)"></app-ub-book-filter>
            </div>

            <!-- 內容 -->
            <div class="col-12 col-lg-10">

                <!-- 大標 -->
                <div class="row px-2 mb-1">
                    <h2 class="ms-1 mb-0 py-2" style="font-size: 2rem;">{{ getCategoryName() }}</h2>
                </div>

                <!-- 上方工具 -->
                <div class="row px-2 py-2 mb-3">
                    <div class="col d-flex align-items-center gap-2">
                        <!-- 選排序 -->
                        <div class="dropdown">
                            <button class="btn btn-outline-primary dropdown-toggle" type="button"
                                data-bs-toggle="dropdown">
                                {{ getStatusLabel([sortBy(), sortDir()]) }}
                            </button>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#"
                                        (click)="onSortOrderSelect(['updated', 'desc']); $event.preventDefault()">更新由新到舊</a>
                                </li>
                                <li><a class="dropdown-item" href="#"
                                        (click)="onSortOrderSelect(['updated', 'asc']); $event.preventDefault()">更新由舊到新</a>
                                </li>
                                <li><a class="dropdown-item" href="#"
                                        (click)="onSortOrderSelect(['price', 'asc']); $event.preventDefault()">價格由低到高</a>
                                </li>
                                <li><a class="dropdown-item" href="#"
                                        (click)="onSortOrderSelect(['price', 'desc']); $event.preventDefault()">價格由高到低</a>
                                </li>
                            </ul>
                        </div>
                        <!-- 選筆數 -->
                        <div class="dropdown">
                            <button class="btn btn-outline-primary dropdown-toggle" type="button"
                                data-bs-toggle="dropdown">
                                {{ getPageSizeLabel(pageSize()) }}
                            </button>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#"
                                        (click)="onPageSizeSelect(20); $event.preventDefault()">每頁20筆</a>
                                </li>
                                <li><a class="dropdown-item" href="#"
                                        (click)="onPageSizeSelect(50); $event.preventDefault()">每頁50筆</a>
                                </li>
                                <li><a class="dropdown-item" href="#"
                                        (click)="onPageSizeSelect(100); $event.preventDefault()">每頁100筆</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- 下方列表 -->
                <div class="row row-cols-2 row-cols-sm-3 row-cols-lg-5 px-2 gx-1 gy-2 bg-white">
                    @for (card of bookCardList; track card.id) {
                    <div class="col">
                        <app-ub-book-card class="h-100" [bookCard]="card"></app-ub-book-card>
                    </div>
                    }
                </div>

                <!-- 查看更多 -->
                <div class="row mt-2">
                    <div class="col text-end">
                        <a href="#" class="view-more-link d-inline-flex align-items-center">
                            查看更多<i class="bi bi-arrow-right ms-1"></i>
                        </a>
                    </div>
                </div>

            </div>

        </div>

    </div>
</section>
