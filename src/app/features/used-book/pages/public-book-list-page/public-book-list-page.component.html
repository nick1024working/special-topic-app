<section class="mb-5">
    <div class="container-fluid" style="width: 90vw;">
        <!-- Breadcrumb -->
        <nav>
            <ol class="breadcrumb my-2">
                <li class="breadcrumb-item"><a class="text-decoration-underline" routerLink="/">首頁</a></li>
                @if (!currentCategory()) {
                <li class="breadcrumb-item text-primary">全部分類</li>
                } @else {
                <li class="breadcrumb-item"><a class="text-decoration-underline" routerLink="/used-book">全部分類</a></li>
                <li class="breadcrumb-item text-primary">{{ currentCategory() }}</li>
                }
            </ol>
        </nav>

        <!-- 版型：左側 sidebar（lg 起為 2 欄 = 1/6），右側內容（10 欄 = 5/6） -->
        <div class="row g-3">

            <!-- Sidebar：小螢幕可收合，大螢幕固定顯示 -->
            <div class="col-12 col-lg-2">
                <app-ub-book-filter (query)="onQuery($event)"></app-ub-book-filter>
            </div>

            <!-- Main Content -->
            <div class="col-12 col-lg-10">

                <div class="row">
                    <h1 class="ms-1 mb-0 py-2">全部分類</h1>
                </div>

                <!-- 產品列表 -->
                <div class="row rounded-3 mx-1 overflow-hidden" style="background-color: #f3f3f3;">
                    <div class="d-flex border-bottom border-1 py-2">
                        <div class="dropdown">
                            <button class="btn btn-outline-primary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                更新由新到舊
                            </button>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#">更新由新到舊</a></li>
                                <li><a class="dropdown-item" href="#">更新由舊到新</a></li>
                                <li><a class="dropdown-item" href="#">價格由低到高</a></li>
                                <li><a class="dropdown-item" href="#">價格由高到低</a></li>
                            </ul>
                        </div>
                    </div>
                    <div class="row gx-1 gy-2 px-2">
                        @for (card of bookCardList; track card.id) {
                        <div class="col-12 col-sm-4 col-md-2">
                            <app-ub-book-card class="h-100" [bookCard]="card"></app-ub-book-card>
                        </div>
                        }
                    </div>
                </div>

                <!-- 查看更多 -->
                <div class="row mt-2">
                    <div class="col text-end">
                        <a href="#" class="view-more-link d-inline-flex align-items-center">
                            查看更多<i class="bi bi-arrow-right ms-1"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <!-- /row -->
    </div>
</section>
