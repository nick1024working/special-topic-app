<!-- product-list-page.component.html -->
<section class="py-5">
    <div class="container">

        <!-- 區塊標題 -->
        <div class="text-center mb-4">
            <p class="text-uppercase text-primary small fw-semibold mb-1">Exclusive Products</p>
            <h2 class="fw-bold border-bottom pb-2 d-inline-block">Special Products</h2>
        </div>

        <!-- Bootstrap Nav Tabs -->
        <ul class="nav nav-tabs justify-content-center mb-4" id="productTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="new-tab" data-bs-toggle="tab" data-bs-target="#new-pane"
                    type="button" role="tab">
                    New Products
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="featured-tab" data-bs-toggle="tab" data-bs-target="#featured-pane"
                    type="button" role="tab">
                    Featured Products
                </button>
            </li>
        </ul>

        <!-- Tab panes -->
        <div class="tab-content">

            <!-- === New Products === -->
            <div class="tab-pane fade show active" id="new-pane" role="tabpanel">
                <swiper-container slides-per-view="4" space-between="16" navigation="true" pagination="true" loop="true"
                    style="--swiper-pagination-color:#0d6efd">
                    @for (p of products; track p.id) {
                    <swiper-slide>
                        <div class="card h-100 position-relative product-card">
                            <!-- Wishlist -->
                            <button
                                class="btn btn-light shadow-sm rounded-circle position-absolute top-0 end-0 m-2 wishlist-btn">
                                <i class="bi bi-heart"></i>
                            </button>

                            <!-- 商品圖 -->
                            <img [src]="p.img" (error)="onImgError($event)" class="card-img-top" alt="{{ p.title }}" />

                            <!-- 評分標籤 -->
                            <span class="badge bg-light text-dark rating-badge">
                                <i class="bi bi-star-fill text-warning me-1"></i>4.5
                            </span>

                            <!-- 文字區 -->
                            <div class="card-body">
                                <h6 class="card-title mb-1">{{ p.title }}</h6>
                                <p class="mb-2">
                                    <span class="fw-bold">\${{ p.price }}</span>
                                    <del class="text-muted ms-1">\${{ p.original }}</del>
                                    @if (p.discount) {
                                        <span class="text-success ms-1">{{ p.discount }} Off</span>
                                    }
                                </p>
                            </div>

                            <!-- 優惠列表 -->
                            <ul class="offer-panel list-unstyled px-3 pb-3">
                                <li><i class="bi bi-percent text-primary me-1"></i>Limited Time Offer: 5% off</li>
                            </ul>
                        </div>
                    </swiper-slide>
                    }
                </swiper-container>
            </div>

            <!-- === Featured Products (示範直接重用同資料) === -->
            <div class="tab-pane fade" id="featured-pane" role="tabpanel">
                <!-- 這裡可放另一組 <swiper-container>，範例略 -->
            </div>

        </div>
    </div>
</section>
