<section class="container">
    <div class="row">
        <!-- 左側 -->
        <div class="col-12 col-md-6 p-0">
            <div class="m-3 bg-light border rounded-3">

                <!-- 工具列 -->
                <div id="toolbar" class="p-3 border rounded-3 bg-body">

                    <!-- 新增標籤 -->
                    <form class="mb-3" (ngSubmit)="create(inputReq)" autocomplete="off" novalidate>
                        <div class="row g-2 align-items-end">
                            <div class="col-12 col-md-6">
                                <label for="nameInput" class="form-label mb-1">新增促銷標籤</label>
                                <input id="nameInput" class="form-control" type="text" name="name"
                                    [(ngModel)]="inputReq.name" required maxlength="50" placeholder="名稱">
                            </div>

                            <div class="col-6 col-sm-3">
                                <div class="form-check form-switch mt-4">
                                    <input id="isActive" class="form-check-input" type="checkbox" name="isActive"
                                        [(ngModel)]="inputReq.isActive">
                                    <label for="isActive" class="form-check-label">啟用</label>
                                </div>
                            </div>

                            <div class="col-12 col-md-3">
                                <button type="submit" class="btn btn-primary"
                                    [disabled]="!inputReq.name.trim() || loading()">新增</button>
                            </div>
                        </div>
                    </form>
                    <div style="height: 2rem;">
                        @if (error()) {
                        <p class="text-danger my-0">{{ error() }}</p>
                        }
                    </div>
                </div>

                <!-- 標籤列表 -->
                <div id="main-area" class="overflow-auto" style="min-height: 70vh;">
                    <ul #sortableList class="tag-list p-2">
                        @for (t of saleTagList(); track t.id){
                        <li class="tag-item">
                            <span class="drag-handle" title="拖曳排序">☰</span>
                            <!-- 名稱-->
                            @if (!t.isEditing) {
                            <span class="tag-text btn-link user-select-none" style="cursor: pointer;">{{ t.name
                                }}</span>
                            } @else {
                            <input class="lh-1" [(ngModel)]="tempName">
                            }
                            <!-- 編輯按鈕 -->
                            @if (!t.isEditing) {
                            <button class="btn btn-sm btn-primary" (click)="onEditToggle(t)">編輯</button>
                            } @else {
                            <button class="btn btn-sm btn-outline-primary" (click)="onEditToggle(t)">確定</button>
                            }
                            <!-- 啟用按鈕 -->
                            @if (t.isActive) {
                            <button class="btn btn-sm btn-primary"
                                (click)="updateActiveStatus(t.id, !t.isActive)">啟用中</button>
                            } @else {
                            <button class="btn btn-sm btn-outline-primary"
                                (click)="updateActiveStatus(t.id, !t.isActive)">未啟用</button>
                            }
                            <!-- 刪除按鈕 -->
                            <button class="btn btn-sm btn-outline-danger" (click)="remove(t.id)"><i
                                    class="bi bi-x"></i></button>
                        </li>
                        }
                    </ul>
                </div>

            </div>
        </div>

        <!-- 右側：統計數據卡 -->
        <div class="col-12 col-md-6 p-0">
            <div class="m-3">
                <div class="row g-3">

                    <!-- 銷售額 -->
                    <div class="col-12 col-sm-6">
                        <div class="card border-light shadow-sm h-100">
                            <div class="card-body p-4">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <div>
                                        <h6 class="text-muted mb-1">銷售額</h6>
                                        <h4 class="m-0">$6,820</h4>
                                    </div>
                                    <div class="bg-info text-white rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
                                        style="width: 60px; height: 60px;">
                                        <i class="bi bi-truck fs-6"></i>
                                    </div>
                                </div>
                                <div class="d-flex align-items-center">
                                    <div class="bg-danger text-white rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
                                        style="width: 20px; height: 20px;">
                                        <i class="bi bi-arrow-right-short" style="transform: rotate(45deg);"></i>
                                    </div>
                                    <small class="text-danger mx-2">-9%</small>
                                    <small class="text-secondary">與上週相比</small>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 營收 -->
                    <div class="col-12 col-sm-6">
                        <div class="card border-light shadow-sm h-100">
                            <div class="card-body p-4">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <div>
                                        <h6 class="text-muted mb-1">營收</h6>
                                        <h4 class="m-0">$21,900</h4>
                                    </div>
                                    <div class="bg-success text-white rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
                                        style="width: 60px; height: 60px;">
                                        <i class="bi bi-currency-dollar fs-6"></i>
                                    </div>
                                </div>
                                <div class="d-flex align-items-center">
                                    <div class="bg-success-subtle text-success rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
                                        style="width: 20px; height: 20px;">
                                        <i class="bi bi-arrow-right-short" style="transform: rotate(-45deg);"></i>
                                    </div>
                                    <small class="text-success mx-2">+26%</small>
                                    <small class="text-secondary">與上週相比</small>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 訪客 -->
                    <div class="col-12 col-sm-6">
                        <div class="card border-light shadow-sm h-100">
                            <div class="card-body p-4">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <div>
                                        <h6 class="text-muted mb-1">訪客</h6>
                                        <h4 class="m-0">3,764</h4>
                                    </div>
                                    <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
                                        style="width: 60px; height: 60px;">
                                        <i class="bi bi-person fs-6"></i>
                                    </div>
                                </div>
                                <div class="d-flex align-items-center">
                                    <div class="bg-success-subtle text-success rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
                                        style="width: 20px; height: 20px;">
                                        <i class="bi bi-arrow-right-short" style="transform: rotate(-45deg);"></i>
                                    </div>
                                    <small class="text-success mx-2">+69%</small>
                                    <small class="text-secondary">與上週相比</small>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 訂單 -->
                    <div class="col-12 col-sm-6">
                        <div class="card border-light shadow-sm h-100">
                            <div class="card-body p-4">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <div>
                                        <h6 class="text-muted mb-1">訂單</h6>
                                        <h4 class="m-0">786</h4>
                                    </div>
                                    <div class="bg-warning text-white rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
                                        style="width: 60px; height: 60px;">
                                        <i class="bi bi-cart fs-6"></i>
                                    </div>
                                </div>
                                <div class="d-flex align-items-center">
                                    <div class="bg-danger text-white rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
                                        style="width: 20px; height: 20px;">
                                        <i class="bi bi-arrow-right-short" style="transform: rotate(45deg);"></i>
                                    </div>
                                    <small class="text-danger mx-2">-21%</small>
                                    <small class="text-secondary">與上週相比</small>
                                </div>
                            </div>
                        </div>
                    </div>



                </div>
            </div>
        </div>

    </div>
</section>
