<div class="container py-4" style="max-width:520px">
  <h3 class="mb-3">忘記密碼</h3>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label class="form-label">手機或 Email</label>
    <input class="form-control" formControlName="accountOrEmail" [disabled]="sending || done">
    <div class="form-text">輸入手機或 Email。我們（若帳號存在）會寄出重設連結。</div>

    <button class="btn btn-primary mt-3" [disabled]="sending || done">送出</button>
  </form>

  <div class="alert alert-success mt-3" *ngIf="done">
    已送出（若帳號存在）。請到信箱收取重設密碼連結。
  </div>
  <div class="alert alert-danger mt-3" *ngIf="error">{{ error }}</div>
</div>
