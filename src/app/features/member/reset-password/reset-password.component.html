<div class="container py-4" style="max-width:520px">
  <h3 class="mb-3">重設密碼</h3>

  <div *ngIf="loading">驗證連結中…</div>
  <div class="alert alert-danger" *ngIf="!loading && !valid">{{ error || '連結無效或已過期' }}</div>

  <form *ngIf="valid && !ok" [formGroup]="form" (ngSubmit)="submit()">
    <label class="form-label">新密碼（至少 8 碼含英數）</label>
    <input type="password" class="form-control" formControlName="newPassword">

    <label class="form-label mt-2">確認新密碼</label>
    <input type="password" class="form-control" formControlName="confirmPassword">

    <button class="btn btn-primary mt-3" [disabled]="saving">送出</button>
  </form>

  <div class="alert alert-success mt-3" *ngIf="ok">
    密碼已更新成功，{{ countdown }} 秒後導回登入頁…
  </div>

  <div class="alert alert-danger mt-3" *ngIf="error && valid && !ok">{{ error }}</div>
</div>
