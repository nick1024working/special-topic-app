<h1 class="font-test text-center text-primary">探索</h1>
<div class="container py-4">
    <!-- 類別 + 搜尋 -->
    <!-- 類別 + 搜尋 -->
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">

        <!-- 分類下拉 -->
        <div class="d-flex align-items-center gap-2">
            <label for="catSelect" class="form-label mb-0">分類</label>
            <select id="catSelect" class="form-select" style="min-width: 220px;" [(ngModel)]="selectedCategory"
                (change)="selectedCategory ? onCategoryChange(selectedCategory) : clearCategory()">
                <!-- 全部 -->
                <option [ngValue]="null">全部</option>
                <!-- 其他分類 -->
                <option *ngFor="let c of categories" [ngValue]="c.slug">{{ c.name }}</option>
            </select>
        </div>

        <!-- 搜尋列 -->
        <div class="input-group" style="max-width: 360px;">
            <input type="text" class="form-control" placeholder="搜尋計畫" [(ngModel)]="searchText"
                (keyup.enter)="onSearch()">
            <button class="btn btn-outline-secondary" (click)="onSearch()">搜尋</button>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-12 col-sm-6 col-lg-3" *ngFor="let project of projects">
            <div class="card h-100 shadow-sm card-hover" (click)="goToDetail(project.id)" style="cursor: pointer;">
                <!-- 專案圖片 -->
                <img [src]="project.mainImagePath || 'assets/images/default.png'" class="card-img-top bg-white"
                    alt="專案主圖" style="object-fit: contain; height: 200px; width: 100%; padding: 10px;">

                <!-- 內容區塊 -->
                <div class="card-body d-flex flex-column">
                    <h4 class="fw-bold">{{ project.projectTitle }}</h4>
                    <p class="text-muted small flex-grow-1">
                        {{ project.projectDescription }}
                    </p>

                    <!-- 進度條 -->
                    <div class="progress mb-2" style="height: 8px;">
                        <div class="progress-bar" role="progressbar" [style.width.%]="getProgressPercent(project)"
                            [ngClass]="{
                   'bg-success': getProgressPercent(project) >= 100,
                   'bg-primary': getProgressPercent(project) < 100
                 }">
                        </div>
                    </div>

                    <!-- 募資金額與剩餘天數 -->
                    <div class="d-flex justify-content-between text-muted small mb-2">
                        <div>已募資：NT$ {{ project.currentAmount | number }}</div>
                        <div>剩餘 {{ getDaysLeft(project.endDate) }} 天</div>
                    </div>
                    <div class="d-flex justify-content-between text-muted small mb-2">
                        <div>募資人數：{{ project.backerCount | number}}人</div>
                    </div>
                    <!-- 狀態與按鈕 -->
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="badge px-3 py-1 rounded-pill"
                            [ngClass]="project.status === '募資中' ? 'bg-primary' : 'bg-secondary'">
                            {{ project.status }}
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
